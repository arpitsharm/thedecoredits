# ===========================
# SITE 1: gopalhospitalloniroad.com (Static HTML/CSS/JS)
# ===========================
server {
    listen 80;
    server_name gopalhospitalloniroad.com www.gopalhospitalloniroad.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gopalhospitalloniroad.com www.gopalhospitalloniroad.com;

    ssl_certificate /etc/ssl/gopalhospitalloniroad/cert.pem;
    ssl_certificate_key /etc/ssl/gopalhospitalloniroad/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static site root
    root /var/www/gopalhospitalloniroad;
    index index.html;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=gopal:10m rate=30r/s;

    # Serve static files directly
    location / {
        limit_req zone=gopal burst=50 nodelay;
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/gopalhospitalloniroad;
    }
}


# ===========================
# SITE 2: thedecoredits.com (Django + Gunicorn)
# ===========================
server {
    listen 80;
    server_name thedecoredits.com www.thedecoredits.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thedecoredits.com www.thedecoredits.com;

    ssl_certificate /etc/ssl/thedecoredits/cert.pem;
    ssl_certificate_key /etc/ssl/thedecoredits/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=django_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=django_chatbot:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=django_api:10m rate=3r/m;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /var/www/thedecoredits/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /var/www/thedecoredits/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/thedecoredits/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Chatbot API - strict rate limit
    location /api/chatbot/ {
        limit_req zone=django_chatbot burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Review/Quote submit - rate limit
    location ~ ^/(product/[0-9]+/review/|quote/[0-9]+/submit/) {
        limit_req zone=django_api burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(py|pyc|pyo|log)$ {
        deny all;
    }

    # All other requests -> Gunicorn
    location / {
        limit_req zone=django_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        root /var/www/thedecoredits/templates;
        internal;
    }

    location = /500.html {
        root /var/www/thedecoredits/templates;
        internal;
    }
}
