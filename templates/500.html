<html lang="en">
<head>

<title>500 - Server Error</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1220;color:#fff;font-family:Inter,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px;}
